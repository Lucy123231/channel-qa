for(var i=0;i<e.s.length;i++){var tt=ct(e.s[i].title);h+='<div style="padding:5px 0;font-size:15px;cursor:pointer;color:#333" onclick="document.getElementById(\'inp\').value=\''+(i+1)+'\';send()">'+(i+1)+'. '+tt+'</div>';}

var CVS=JSON.parse(localStorage.getItem("qa_cvs")||"[]");
var CID=null;
function sc(){localStorage.setItem("qa_cvs",JSON.stringify(CVS));}
function nc(){var c={id:"c"+Date.now(),title:"新会话",msgs:[],tm:new Date().toISOString()};CVS.unshift(c);sc();sw(c.id);rc();}
function sw(id){CID=id;var c=CVS.find(function(x){return x.id===id});if(!c)return;document.getElementById("msgs").innerHTML="";if(c.msgs.length===0)document.getElementById("msgs").innerHTML="<div style=\"text-align:center;color:#bbb;padding:60px 0\">输入问题开始对话</div>";else for(var i=0;i<c.msgs.length;i++)am(c.msgs[i].t,c.msgs[i].c,true);rc();}
function dc(id){if(!confirm('确认删除该会话吗？删除后无法恢复。'))return;CVS=CVS.filter(function(c){return c.id!==id});sc();if(CID===id){CID=CVS.length?CVS[0].id:null;CID?sw(CID):nc();}rc();} function rc(){var l=document.getElementById("cl");l.innerHTML=CVS.map(function(c){var on=c.id===CID?" on":"";var t=c.title||"新会话";var d=new Date(c.tm).toLocaleDateString("zh-CN",{month:"short",day:"numeric"});return "<div class=\"cv"+on+"\" onclick=\"sw('"+c.id+"')\"><div>"+t+"<br><small>"+d+" "+c.msgs.length+"条</small></div><span class=\"x\" onclick=\"event.stopPropagation();dc('"+c.id+"')\">&times;</span></div>";}).join("");}
function av(t,c){var cv=CVS.find(function(x){return x.id===CID});if(!cv)return;cv.msgs.push({t:t,c:c,tm:new Date().toISOString()});if(cv.title==="新会话"&&cv.msgs.length===1&&t==="u"){cv.title=c.substring(0,25);}sc();rc();}
function am(t,c,nosave){var ms=document.getElementById("msgs");var d=document.createElement("div");d.className="msg "+(t==="u"?"u":"a");d.innerHTML=t==="u"?"<div>"+c+"</div>":c;ms.appendChild(d);setTimeout(function(){ms.scrollTop=999999;},100);if(!nosave)av(t,c);}
if(CVS.length===0)nc();else sw(CVS[0].id);
document.getElementById("nb").onclick=nc;
for(var i=0;i<qs.length;i++){(function(q){
var s=document.createElement('span');s.textContent=q[0];s.onclick=function(){document.getElementById('inp').value=q[1];send();};qb.appendChild(s);
})(qs[i]);}
